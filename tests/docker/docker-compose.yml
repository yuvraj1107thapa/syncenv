version: '3.8'

networks:
  syncenv-test:
    name: syncenv-test
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:
  alpha:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile
      args:
        SYNCENV_BIN: ${SYNCENV_BIN:-target/syncenv}
    hostname: alpha.local
    container_name: syncenv-alpha
    networks:
      syncenv-test:
        ipv4_address: 172.20.0.2
        aliases:
          - alpha.local
    volumes:
      - ./ssh-keys:/mnt/ssh-keys:ro
      - alpha-data:/home/syncenv/.config/syncenv
    environment:
      - SYNCENV_DEBUG=1
      - CONTAINER_NAME=alpha
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    privileged: true

  beta:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile
      args:
        SYNCENV_BIN: ${SYNCENV_BIN:-target/syncenv}
    hostname: beta.local
    container_name: syncenv-beta
    networks:
      syncenv-test:
        ipv4_address: 172.20.0.3
        aliases:
          - beta.local
    volumes:
      - ./ssh-keys:/mnt/ssh-keys:ro
      - beta-data:/home/syncenv/.config/syncenv
    environment:
      - SYNCENV_DEBUG=1
      - CONTAINER_NAME=beta
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    privileged: true

  gamma:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile
      args:
        SYNCENV_BIN: ${SYNCENV_BIN:-target/syncenv}
    hostname: gamma.local
    container_name: syncenv-gamma
    networks:
      syncenv-test:
        ipv4_address: 172.20.0.4
        aliases:
          - gamma.local
    volumes:
      - ./ssh-keys:/mnt/ssh-keys:ro
      - gamma-data:/home/syncenv/.config/syncenv
    environment:
      - SYNCENV_DEBUG=1
      - CONTAINER_NAME=gamma
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    privileged: true

volumes:
  alpha-data:
    name: syncenv-test_alpha-data
  beta-data:
    name: syncenv-test_beta-data
  gamma-data:
    name: syncenv-test_gamma-data
